name: Sync Pluggy
on:
  schedule:
    - cron: '47 9,15,23 * * *'   # 6h47, 12h47 e 20h47 de Brasília
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node sync.mjs
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_ITEM_IDS: e5450539-6faa-46a5-9b60-686932e79dbc,b71b33b3-83e7-47ec-845d-8c95cc75a0cc,2ced0015-4d81-4dda-9484-352c4537fe87,9443754b-3d7b-4a04-a595-823af681308e
      - name: Publica no ramo dados (sem histórico)
        run: |
          cd out
          git init -q -b dados
          git config user.name central-sync; git config user.email central-sync@users.noreply.github.com
          git add inbox.enc.json
          git commit -qm "dados $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dados
