name: Sync Pluggy
on:
  schedule:
    - cron: '17 9,15,21 * * *'   # 6h17, 12h17 e 18h17 de Brasília
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node sync.mjs
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_ITEM_IDS: e5450539-6faa-46a5-9b60-686932e79dbc,b71b33b3-83e7-47ec-845d-8c95cc75a0cc,2ced0015-4d81-4dda-9484-352c4537fe87
      - uses: actions/upload-artifact@v4
        with: { name: inbox, path: out/inbox.json, retention-days: 3 }
